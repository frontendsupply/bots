name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Tests
        run: node --test tests/*.test.mjs

      - name: Examples are valid and up to date
        run: |
          for d in examples/*/; do node kit/build.mjs "$d$(basename "$d").json"; done
          git diff --exit-code -- examples || { echo "Rebuild the examples and commit their SVGs."; exit 1; }
